    tamil: >-
      கையொப்பமிட்ட ஒப்பந்தத்தின் ஒரு அசலை வாடகைதாரருக்கு வழங்க வேண்டும். இல்லையெனில்
      நிபந்தனைகளை நிரூபிக்க முடியாது.
    counter_clause: >-
      The Landlord shall provide the Tenant with one original signed and
      registered agreement within fifteen (15) days of execution, as required by
      Section 12 of the Act.
    negotiation_tip: >-
      Nothing to trade here - insist on it as a document-handling formality
