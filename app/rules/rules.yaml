    statute:
      act: *act
      section: "12"
      heading: "Agreement to be given to the tenant"
      quote: >-
        After the tenancy agreement has been signed by both the landlord and
        tenant, the landlord shall give one original signed and registered
        agreement to the tenant within fifteen days of the agreement being signed
        by them ...
      url: *act_url
      verification: verified
